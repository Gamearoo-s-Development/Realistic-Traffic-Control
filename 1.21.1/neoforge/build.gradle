plugins {
    id 'java-library'
    id 'idea'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    validateAccessTransformers = true

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Cursemaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'CC-Tweaked'
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'cc.tweaked' }
    }
}

dependencies {
    // Optional integration mods shipped in deps/ (CC:Tweaked, Immersive Railroading, TrackAPI, UMC).
    compileOnly fileTree(dir: 'deps', include: '*.jar', exclude: 'create-*.jar')
    additionalRuntimeClasspath fileTree(dir: 'deps', include: '*.jar', exclude: 'create-*.jar')
    implementation files('deps/create-1.21.1-6.0.10.jar')
    compileOnly files(layout.buildDirectory.file('extracted/ponder-api.jar'))
    compileOnly 'cc.tweaked:cc-tweaked-1.21.1-common-api:1.119.0'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.27.0.344'
}

tasks.register('extractPonderApi') {
    def createJar = file('deps/create-1.21.1-6.0.10.jar')
    def outJar = layout.buildDirectory.file('extracted/ponder-api.jar')
    inputs.file(createJar)
    outputs.file(outJar)
    doLast {
        copy {
            from(zipTree(createJar))
            include 'META-INF/jarjar/ponder-neoforge-*.jar'
            eachFile { details -> details.path = 'ponder-api.jar' }
            includeEmptyDirs = false
            into layout.buildDirectory.dir('extracted').get().asFile
        }
    }
}

tasks.named('compileJava').configure {
    dependsOn('extractPonderApi')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('auditCrossingTextures', Exec) {
    workingDir layout.projectDirectory.dir('../..').asFile
    commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
            'port-tools/scripts/audit-crossing-textures.ps1'
}
